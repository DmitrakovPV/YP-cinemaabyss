name: Build, Push and Test

on:
  push:
    branches: [ main, master, cinema ]
  pull_request:
    branches: [ main, master, cinema ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/yp-cinemaabyss

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: monolith
            context: src/monolith
            image: monolith
          - name: movies-service
            context: src/microservices/movies
            image: movies-service
          - name: events-service
            context: src/microservices/events
            image: events-service
          - name: proxy-service
            context: src/microservices/proxy
            image: proxy-service

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false
          sbom: false
  api-tests:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for all services to become healthy
        run: |
          set -e
          for url in \
            http://127.0.0.1:8080/health \
            http://127.0.0.1:8081/api/movies/health \
            http://127.0.0.1:8082/api/events/health \
            http://127.0.0.1:8000/health ; do
            echo "Waiting for $url ..."
            timeout 180 bash -c "until curl -sf '$url' >/dev/null; do sleep 3; done"
          done
          echo "All services are up"

      - name: Run Newman API tests
        working-directory: tests/postman
        run: |
          npm ci
          npm run test:local

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: tests/postman/reports/